name: SQL Linting
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install SQLFluff
        run: pip install sqlfluff
      - name: Lint SQL
        run: sqlfluff lint sql/ --dialect bigquery
